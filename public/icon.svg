<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Radar Rings in Background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8" opacity="0.25" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.2" />

  <!-- Alarm Bell -->
  <g filter="url(#shadow)">
    <!-- Bell Top Ring -->
    <path d="M 236 120 C 236 108 244 100 256 100 C 268 100 276 108 276 120" fill="none" stroke="url(#bellGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Bell Dome -->
    <path d="M 160 300 C 160 210 190 140 256 140 C 322 140 352 210 352 300 C 352 330 380 340 380 350 C 380 360 370 364 360 364 L 152 364 C 142 364 132 360 132 350 C 132 340 160 330 160 300 Z" fill="url(#bellGrad)" />
    <!-- Clapper -->
    <path d="M 230 364 C 230 382 242 396 256 396 C 270 396 282 382 282 364" fill="#b45309" />
  </g>

  <!-- Sound Waves (Alarm ringing vibes) -->
  <path d="M 110 210 C 90 235 90 275 110 300" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <path d="M 402 210 C 422 235 422 275 402 300" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />

  <!-- Company Pin / Check-in Badge -->
  <g filter="url(#shadow)">
    <circle cx="350" cy="350" r="76" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="8" />
    <path d="M 326 350 L 344 368 L 378 332" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
